default:
  enabled: false
  # The previous default (openai/gpt-oss-120b:free) is "unavailable for free" on OpenRouter.
  model: "minimax/minimax-m3.1-flash:free"
  # Vision-capable free OpenRouter model, used when a playbook enables vision_attachments.
  vision_model: "google/gemma-4-31b-it:free"
  temperature: 0.3
  history_limit: 30
  max_tool_calls: 10
  timeout: 60
  # Word inside the <<<...>>> delimiters that wrap third-party text in prompts.
  untrusted_marker: UNTRUSTED
