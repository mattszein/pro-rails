# =============================================================
# Base stack. Never publishes host ports, never joins an external
# network. Composition is chosen by COMPOSE_FILE in .env:
#
#   embedded + local ports   docker-compose.yml:docker-compose.expose.yml
#   embedded + traefik       docker-compose.yml:docker-compose.traefik.yml
#   external + traefik       docker-compose.yml:docker-compose.traefik.yml
#
# Infra mode is chosen by COMPOSE_PROFILES in .env:
#   embedded  COMPOSE_PROFILES=infra   -> db + redis run in this project
#   external  COMPOSE_PROFILES=        -> connect to DB_HOST / REDIS_HOST
# =============================================================

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
    target: base
    args:
      RUBY_VERSION: "3.4.4"
      PG_MAJOR: ${PG_VERSION:-17}
  environment: &backend_environment
    RAILS_ENV: ${RAILS_ENV:-development}
    DB_USERNAME: ${DB_USERNAME:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:-postgres}
    DB_PORT: ${DB_PORT:-5432}
    DB_HOST: ${DB_HOST:-db}
    DB_NAME_PREFIX: ${DB_NAME_PREFIX:-pro_rails}
    APP_HOST: ${APP_HOST:-localhost}
    APP_PORT: ${APP_PORT:-3000}
    RAILS_MAX_THREADS: 5
    MAILER_ADDRESS: "maildev"
    MAILER_PORT: 1025
    # Assembled from parts so no generator ever hardcodes a host or port.
    REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-1}
    ANYCABLE_WEBSOCKET_URL: ${ANYCABLE_WEBSOCKET_URL:-ws://localhost:8080/cable}
    ANYCABLE_SECRET: ${ANYCABLE_SECRET:-anycable_key}
    CHROME_URL: ${CHROME_URL:-http://chrome:3333}
    HISTFILE: /usr/local/hist/.bash_history
    IRB_HISTFILE: /usr/local/hist/.irb_history
    PSQL_HISTFILE: /usr/local/hist/.psql_history
    EDITOR: vi
    GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
  volumes:
    - .:/pro-rails
    - pro-rails-cache:/pro-rails/tmp/cache
    - pro-rails-bundle:/usr/local/bundle
    - pro-rails-storage:/pro-rails/storage
    - pro-rails-history:/usr/local/hist
  tmpfs:
    - /tmp:exec
    - /pro-rails/tmp/pids
  networks:
    - default
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on: &backend_depends_on
    ws:
      condition: service_started
    db:
      condition: service_healthy
      required: false
    redis:
      condition: service_healthy
      required: false

services:
  db:
    image: ${PG_IMAGE:-postgres:17.5-alpine3.22}
    profiles: [infra]
    volumes:
      - pro-rails-postgres-db:/var/lib/postgresql/data
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
      PSQL_HISTFILE: /root/log/.psql_history
    healthcheck:
      test: pg_isready -U ${DB_USERNAME:-postgres} -h 127.0.0.1
      interval: 5s

  redis:
    image: redis:8.2.0-alpine3.22
    profiles: [infra]
    volumes:
      - pro-rails-redis:/data
    healthcheck:
      test: redis-cli ping
      interval: 1s
      timeout: 3s
      retries: 30

  jobs:
    <<: *backend
    command: /bin/bash -c "bin/jobs start"
    environment:
      <<: *backend_environment
      RAILS_LOG_TO_STDOUT: "true"
    tty: true

  rails:
    <<: *backend
    # No `rm -f tmp/pids/server.pid`: tmp/pids is a tmpfs, empty on every start.
    command: /bin/bash -c "bundle exec rails s -p 3000 -b '0.0.0.0'"
    environment:
      <<: *backend_environment
      ANYCABLE_RPC_HOST: 0.0.0.0:50051
      ANYCABLE_DEBUG: "1"
      ANYCABLE_LOG_LEVEL: "debug"
    tty: true
    depends_on:
      <<: *backend_depends_on
      maildev:
        condition: service_started
      jobs:
        condition: service_started

  ws:
    image: anycable/anycable-go:1.6.3-alpine
    environment:
      ANYCABLE_HOST: "0.0.0.0"
      ANYCABLE_PORT: 8080
      ANYCABLE_REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-1}
      ANYCABLE_RPC_HOST: rails:50051
      ANYCABLE_DEBUG: true
      ANYCABLE_TURBO_STREAMS: true
      ANYCABLE_SECRET: ${ANYCABLE_SECRET:-anycable_key}
      ANYCABLE_JWT_ID_KEY: ${ANYCABLE_JWT_ID_KEY:-anycable_key}
      ANYCABLE_BROADCAST_ADAPTER: "redisx"
      ANYCABLE_BROKER: "memory"
      ANYCABLE_REDIS_CHANNEL: ${ANYCABLE_REDIS_CHANNEL:-__anycable__}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - default

  maildev:
    image: maildev/maildev
    restart: always
    environment:
      MAILDEV_SMTP_PORT: 1025
      MAILDEV_WEB_PORT: 8025
      MAILDEV_MAIL_DIRECTORY: /home/node/data
    volumes:
      - pro-rails-mc-data:/home/node

  chrome:
    image: browserless/chrome:latest
    volumes:
      - .:/rails-app
    environment:
      PORT: 3333
      CONNECTION_TIMEOUT: 600000
      MAX_CONCURRENT_SESSIONS: 1
      QUEUE_LENGTH: 2
      PREBOOT_CHROME: "true"
      KEEP_ALIVE: "true"

  test_system:
    <<: *backend
    command: rspec spec/system
    environment:
      <<: *backend_environment
      RAILS_ENV: test
      APP_HOST: ${APP_HOST:-anycable.test}
      ANYCABLE_RPC_HOST: 0.0.0.0:50051
      ANYCABLE_HTTP_BROADCAST_URL: http://ws.anycable.test:8090/_broadcast
      ANYCABLE_WEBSOCKET_URL: ${ANYCABLE_WEBSOCKET_URL:-ws://ws.anycable.test:8081/cable}
    depends_on:
      <<: *backend_depends_on
      chrome:
        condition: service_started
      ws_test:
        condition: service_started
    networks:
      default:
        aliases:
          - anycable.test

  ws_test:
    image: anycable/anycable-go:1.6.3-alpine
    environment:
      ANYCABLE_HOST: "0.0.0.0"
      ANYCABLE_PORT: "8081"
      ANYCABLE_REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-1}
      ANYCABLE_BROKER: ""
      ANYCABLE_RPC_HOST: anycable.test:50051
      ANYCABLE_SECRET: ${ANYCABLE_SECRET:-anycable_key}
      ANYCABLE_JWT_ID_KEY: ${ANYCABLE_JWT_ID_KEY:-anycable_key}
      ANYCABLE_BROADCAST_ADAPTER: "redisx"
      ANYCABLE_TURBO_STREAMS: true
      ANYCABLE_REDIS_CHANNEL: ${ANYCABLE_REDIS_CHANNEL:-__anycable__}
    networks:
      default:
        aliases:
          - ws.anycable.test

networks:
  default: {}

volumes:
  pro-rails-postgres-db:
  pro-rails-bundle:
  pro-rails-cache:
  pro-rails-storage:
  pro-rails-history:
  pro-rails-mc-data:
  pro-rails-redis:
